<div class="max-w-2xl mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Create a Quiz</h1>
    <p class="text-gray-500 mt-1">Test your vocabulary knowledge</p>
  </div>

  <mat-card class="rounded-2xl shadow-sm">
    <mat-card-content class="p-6 space-y-8">

      <!-- Topic -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Topic</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Select a topic</mat-label>
          <mat-select [ngModel]="selectedTopicId()" (ngModelChange)="selectedTopicId.set($event)">
            @for (topic of topics(); track topic.id) {
              <mat-option [value]="topic.id">
                {{ topic.name }}
                <span class="text-gray-400 text-xs ml-2">({{ topic.vocabularyCount }} words)</span>
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Quiz Type -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">Quiz Type</label>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          @for (type of quizTypes; track type.value) {
            <button
              class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 transition-all"
              [class]="selectedType() === type.value
                ? 'border-green-500 bg-green-50 text-green-700'
                : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'"
              (click)="selectedType.set(type.value)"
            >
              <mat-icon>{{ type.icon }}</mat-icon>
              <span class="text-sm font-medium">{{ type.label }}</span>
            </button>
          }
        </div>
      </div>

      <!-- Question Count -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Number of Questions: <span class="text-green-600">{{ questionCount() }}</span>
        </label>
        <div class="flex gap-3 flex-wrap">
          @for (count of [5, 10, 15, 20, 30]; track count) {
            <button
              mat-stroked-button
              [color]="questionCount() === count ? 'primary' : ''"
              [class]="questionCount() === count ? 'bg-green-50' : ''"
              (click)="questionCount.set(count)"
            >{{ count }}</button>
          }
        </div>
      </div>

      @if (error()) {
        <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm">
          {{ error() }}
        </div>
      }

      <button
        mat-flat-button
        color="primary"
        class="w-full h-12 text-base"
        [disabled]="!selectedTopicId() || loading()"
        (click)="generate()"
      >
        @if (loading()) {
          <mat-icon class="animate-spin">refresh</mat-icon>
          Generating...
        } @else {
          <mat-icon>play_arrow</mat-icon>
          Start Quiz
        }
      </button>

    </mat-card-content>
  </mat-card>
</div>
