services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xanh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xanh_vocab}
      POSTGRES_USER: ${POSTGRES_USER:-xanh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xanh} -d ${POSTGRES_DB:-xanh_vocab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Zookeeper ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: xanh_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: xanh_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ─── Backend ──────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thaitien280401-stack/xanh/xanh-backend}:${IMAGE_TAG:-latest}
    container_name: xanh_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xanh_vocab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-xanh}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      EXTERNAL_VOCAB_API_BASE_URL: ${EXTERNAL_VOCAB_API_BASE_URL:-https://api.dictionaryapi.dev/api/v2/entries/en}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend (Nginx + SSL) ───────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/thaitien280401-stack/xanh/xanh-frontend}:${IMAGE_TAG:-latest}
    container_name: xanh_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx.conf template uses ${DOMAIN} for server_name and SSL certificate paths
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro

  # ─── Certbot (Let's Encrypt auto-renewal) ────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: xanh_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      # Docker socket allows certbot to reload nginx after successful renewal
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Renew certificates every 12 h and reload nginx so the new cert is picked up.
    # Initial certificate issuance is done by scripts/init-letsencrypt.sh.
    # The deploy-hook sends a reload signal to the nginx container; the `|| true`
    # ensures a temporary nginx hiccup won't abort an otherwise successful renewal.
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache docker-cli 2>/dev/null || true;
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook 'docker exec xanh_frontend nginx -s reload || true';
          sleep 12h & wait $${!};
        done"

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  certbot_certs:
  certbot_webroot:
